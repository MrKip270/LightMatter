<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightMatter — what’s visible in the sky tonight</title>
  <meta
    name="description"
    content="Enter a location and see what’s actually visible in the sky tonight: cloud cover, light pollution, moonlight and aurora, combined into one answer."
  />
  <meta name="theme-color" content="#050308" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23050308'/><text x='16' y='22' font-size='20' text-anchor='middle' fill='%23cf7994'>◐</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- The map sits underneath everything. Chrome is rendered by app.js BEFORE
       the map is initialised, so a Leaflet or network failure leaves a usable
       interface rather than a blank page. -->
  <main>
    <div id="map" aria-label="Map of sky conditions"></div>
  </main>

  <div id="ui"></div>

  <!-- First-visit explainer. Dismissal is remembered, so it never nags. -->
  <div id="entry" class="entry" hidden>
    <div class="entry-card" role="dialog" aria-modal="true" aria-labelledby="entry-title" tabindex="-1">
      <p class="eyebrow">Before you start</p>
      <h1 class="display" id="entry-title">
        Find out what’s <em>actually</em><br />visible tonight.
      </h1>
      <p class="lede">
        Enter a place, use your location, or click the map. LightMatter combines
        cloud cover, light pollution, moonlight and aurora activity into a single
        answer — and tells you the best window to go outside.
      </p>
      <button class="primary" id="entry-proceed">Open the map</button>
    </div>
  </div>

  <!-- Surfaces failures instead of leaving a silent blank page. -->
  <div id="notice" class="notice" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Pure modules first — no DOM access, covered by the test suite. -->
  <script src="coords.js"></script>
  <script src="format.js"></script>
  <script src="app.js"></script>
</body>
</html>
