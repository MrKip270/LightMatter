<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightMatter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>LightMatter</h1>
    <p class="tagline">See what's viewable in the sky from anywhere.</p>

    <!-- Location input. A <form> lets the user press Enter to submit. -->
    <form id="location-form">
      <div class="input-wrap">
        <input
          id="place-input"
          type="text"
          placeholder="Enter a city or (lat, lon)"
          autocomplete="off"
        />
        <ul id="suggestions" class="suggestions" hidden></ul>
      </div>
      <button type="submit">Search</button>
      <button type="button" id="locate-btn">Use my location</button>
      <button type="button" id="map-btn" aria-expanded="false" aria-controls="map-panel">
        Pick on map
      </button>
    </form>

    <!-- The map panel. Empty until the button is pressed: Leaflet's script,
         stylesheet, and map tiles are all loaded on first open, so visitors who
         never use the map never download any of it. -->
    <section id="map-panel" class="map-panel" hidden>
      <p class="detail muted">Click anywhere to check the sky there.</p>

      <div class="map-controls">
        <label class="control">
          <input type="checkbox" id="overlay-toggle" checked />
          Light pollution overlay
        </label>
        <label class="control" id="opacity-control">
          Opacity
          <input type="range" id="overlay-opacity" min="0" max="100" value="65" />
        </label>
      </div>

      <div id="map"></div>

      <!-- Legend is built from the same palette the server draws tiles with,
           fetched at runtime so the two can never drift apart. -->
      <div id="legend" class="legend" hidden></div>
    </section>

    <!-- Short status/error messages appear here. -->
    <p id="status" class="status"></p>

    <!-- Results get built into this box by app.js. -->
    <section id="results" class="results" hidden></section>
  </main>

  <!-- Pure coordinate helpers, loaded first so app.js can use them.
       Kept separate because they have no DOM dependencies, which lets the
       Node test suite require() and cover them. -->
  <script src="coords.js"></script>
  <script src="app.js"></script>
</body>
</html>
