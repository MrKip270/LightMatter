<!DOCTYPE html>
<!--
  ============================================================================
  PROTOTYPE — THROWAWAY. DELETE OR ABSORB WHEN IT HAS ANSWERED ITS QUESTION.
  ============================================================================

  Question: what should LightMatter's main page look like?

  Now a SINGLE direction (was three). Variants B and C were dropped after the
  first pass; we are developing A. See NOTES.md.

  Sub-shape B per prototype/UI.md: a throwaway route, because this replaces the
  entire page layout rather than a subtree. frontend/index.html is untouched —
  delete frontend/prototype/ and nothing else changes.

  Prototype rules: no tests, no abstractions, minimal error handling. The
  ANSWER is the deliverable, not this code.

  Run: npm start, then http://localhost:3000/prototype/
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightMatter — UI prototype</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="prototype.css" />
</head>
<body>

  <!-- Map sits underneath everything. If Leaflet fails to load, this stays a
       flat dark panel and the interface above it still works — the previous
       version put map setup first and a single exception blanked the page. -->
  <div id="map" aria-label="Map of sky conditions"></div>

  <!-- All chrome is rendered here by prototype.js. -->
  <div id="ui"></div>

  <!-- Entry overlay. -->
  <div id="entry" class="entry" hidden>
    <div class="entry-card">
      <p class="eyebrow">Before you start</p>
      <h1 class="display">Find out what's <em>actually</em><br />visible tonight.</h1>
      <p class="lede">
        Enter a place, or click the map. LightMatter combines cloud cover, light
        pollution, moonlight and aurora activity into a single answer.
      </p>
      <fieldset class="entry-toggles">
        <legend>Start with these layers</legend>
        <label><input type="checkbox" data-layer="light" checked /> Light pollution</label>
        <label class="dim"><input type="checkbox" data-layer="aurora" disabled /> Aurora — not built yet</label>
      </fieldset>
      <button class="primary" id="entry-proceed">Open the map</button>
    </div>
  </div>

  <!-- Prototype scaffolding. Deliberately plain so it doesn't read as part of
       the design being judged. Hidden outside localhost. -->
  <div id="scaffold" class="scaffold">
    <span class="tag">PROTOTYPE</span>
    <button id="replay">Replay intro</button>
  </div>

  <!-- Surfaces script errors instead of leaving a blank screen. -->
  <div id="crash" class="crash" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../coords.js"></script>
  <script src="prototype.js"></script>
</body>
</html>
